title: CFS Reveal.js
author: CFS Quarto contributors
version: 0.1.0
quarto-required: ">=1.5.0"
contributes:
  formats:
    revealjs:
      filters:
        - author-footer.lua
      theme: [default, theme.scss]
      template-partials:
        - partials/title-slide.html
      width: 1600
      height: 900
      margin: 0.06
      center: false
      center-title-slide: false
      title-slide-attributes:
        data-background-color: "#F5F7F3"
      transition: fade
      background-transition: fade
      controls: true
      controls-layout: edges
      slide-number: c/t
      show-slide-number: all
      preview-links: auto
      code-copy: false
      chalkboard: false
      footer: Canadian Forest Service research
